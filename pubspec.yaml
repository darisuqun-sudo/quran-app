name: quran_app
description: "Quran app for Uyghur Arabic reading, audio, translations, prayer times and qibla"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  drift: ^2.35.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  geolocator: ^14.0.3
  flutter_compass: ^0.8.1
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  hijri: ^3.0.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/data/quran_uyghur_saleh.json

  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
